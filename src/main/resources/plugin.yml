name: HyperEnderChest
version: '${version}'
main: it.hyperenderchest.SharedEnderChestPlugin
description: Personal and shared Ender Chests with hopper support
author: HyperEnderChest
api-version: '26.2'
commands:
  enderchest:
    description: Manages personal and shared Ender Chests
    usage: /enderchest <open|share|accept|deny|view|unshare|hopperaxe>
    aliases: [hec]
    permission: hyperenderchest.use
permissions:
  hyperenderchest.use:
    description: Uses HyperEnderChest
    default: true
  hyperenderchest.share:
    description: Creates and revokes shares
    default: op
  hyperenderchest.hopper:
    description: Gets the axe and configures physical Ender Chests for hoppers
    default: op
